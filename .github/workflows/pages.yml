# Sunumu GitHub Pages'te yayınlar. main dalına her yüklemede otomatik çalışır;
# Actions sekmesinden "Run workflow" ile elle de çalıştırılabilir.
# Sitede sadece sunum dosyaları yer alır (tools/, server.js, README yayınlanmaz).
name: Sunumu yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Dosyaları al
        uses: actions/checkout@v4

      - name: Pages ayarı
        uses: actions/configure-pages@v5

      - name: Site klasörünü hazırla
        run: |
          mkdir -p _site
          cp index.html deck.css deck.js _site/
          cp -r assets embeds _site/
          touch _site/.nojekyll
          ls -R _site | head -50

      - name: Siteyi paketle
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Yayınla
        id: deployment
        uses: actions/deploy-pages@v4
