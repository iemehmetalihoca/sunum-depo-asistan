<style>/* V301 · Ceyhan Depo Tablet — büyük dokunma alanları, yüksek kontrast, az yazı. */

<div id="root"></div>
<script>
/* Ceyhan Depo Tablet · GitHub yayını: paket.json (Malzeme Masterı, depolar, departmanlar) açılışta kendiliğinden yüklenir.
   Tablet ekranının kendi "yeni paket" yolunu kullanır: paket tablettekinden yeniyse alınır, eskiyse dokunulmaz.
   İnternet yoksa tablette kayıtlı son paketle çalışır. Paketi güncellemek için GitHub'da paket.json değiştirilir. */
(function () {
  var KEY = "ceyhan-tablet-v301-handoff-package";
  if (!window.fetch) return;
  fetch("paket.json", { cache: "no-store" })
    .then(function (r) { return r.ok ? r.text() : null; })
    .then(function (text) {
      if (!text) return;
      var data;
      try { data = JSON.parse(text); } catch (e) { return; }
      if (!data || data.kind !== "ceyhan-tablet-paketi" || !Array.isArray(data.materials)) return;
      try { localStorage.setItem(KEY, text); } catch (e) { return; }
      window.dispatchEvent(new Event("focus"));
    })
    .catch(function () {});
})();
